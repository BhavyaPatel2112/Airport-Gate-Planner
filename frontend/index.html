<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Live stand planning for Mumbai airport on real flight data" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mumbai Airport, Live</title>
    <link rel="preload" as="image" href="/assets/earth_day_4096.jpg" />
    <link rel="preload" as="image" href="/assets/earth_night_4096.jpg" />
    <link rel="preload" as="image" href="/assets/earth_bump_roughness_clouds_4096.jpg" />
    <style>
      html, body { margin: 0; background: #05070b; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(120% 100% at 70% 40%, #0c1222 0%, #05070b 60%);
        color: #8b93a3; font: 500 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
      .boot i { display: block; width: 120px; height: 2px; margin: 14px auto 0; border-radius: 2px; background: linear-gradient(90deg, transparent, #8b7dff, transparent);
        background-size: 200% 100%; animation: boot 1.2s linear infinite; }
      @keyframes boot { from { background-position: 100% 0 } to { background-position: -100% 0 } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><div>Mumbai Gate Planner<i></i></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
